[agent]
 interval = "10s"
 round_interval = true
 metric_batch_size = 1000
 metric_buffer_limit = 10000
 collection_jitter = "0s"
 flush_interval = "10s"
 flush_jitter = "0s"
 precision = "0s"
 debug = false


# 1. Мониторинг процессора (CPU)
[[inputs.cpu]]
  ## Сбор метрик по каждому ядру отдельно (true) или только общая статистика (false)
  percpu = false
  ## Сбор общей статистики по системе
  totalcpu = true
  ## Сохранять «сырые» данные процессорного времени, если это необходимо
  collect_cpu_time = false
  ## Фильтрация полей: исключаем неиспользуемые типы времени для экономии места (опционально)
  fieldexclude = ["time_guest", "time_guest_nice"]

# 2. Мониторинг оперативной памяти (RAM)
[[inputs.mem]]
  # Плагин не требует дополнительных настроек для сбора основных метрик (total, available, used, free)

# 3. Мониторинг дисковой подсистемы (Использование места)
[[inputs.disk]]
  ## Игнорировать указанные типы файловых систем (системные и виртуальные ФС)
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# 4. Мониторинг сетевых интерфейсов (Трафик и ошибки)
[[inputs.net]]
  ## Список интерфейсов для мониторинга. Если пусто [], собираются метрики со всех доступных интерфейсов
  interfaces = ["enp1s0"]

# 5. Мониторинг параметров ядра Linux
[[inputs.kernel]]
  ## Собирает информацию об энтропии, контекстных переключениях, прерываниях и аптайме

# 6. Мониторинг состояния процессов
[[inputs.processes]]
  ## Собирает общее количество процессов в различных состояниях (running, sleeping, blocked, zombie)

