[[outputs.influxdb]]
  ## URL-адрес сервера InfluxDB 1.x
  urls = ["http://localhost:8086"]

  ## Имя базы данных
  database = "my_metrics"

  ## Время ожидания ответа от InfluxDB
  timeout = "5s"

